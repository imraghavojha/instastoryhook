[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "instastoryhook"
version = "0.1.0"
description = "Self-hosted Instagram story polling with durable JSON webhook delivery"
requires-python = ">=3.11"
dependencies = ["instagrapi==3.0.18", "httpx==0.28.1", "pydantic>=2,<3"]

[project.optional-dependencies]
chrome = ["browser-cookie3==0.20.1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
instastoryhook = "instastoryhook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
